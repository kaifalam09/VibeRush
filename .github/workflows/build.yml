name: Build VibeRush APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Create Flutter Android project
        run: |
          cp main.dart /tmp/viberush_main.dart
          cp pubspec.yaml /tmp/viberush_pubspec.yaml

          flutter create \
            --platforms=android \
            --org com.viberush.app \
            --project-name viberush \
            .

          cp /tmp/viberush_main.dart lib/main.dart
          cp /tmp/viberush_pubspec.yaml pubspec.yaml

      - name: Remove default Flutter test
        run: |
          rm -f test/widget_test.dart

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          text = text.replace(
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = 36"
          )

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 21"
          )

          p.write_text(text)
          PY
          fi

      - name: Configure AdMob
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          export ADMOB_APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"

          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()
          app_id = os.environ["ADMOB_APP_ID"]

          if "android.permission.INTERNET" not in text:
              first_close = text.find(">")

              if first_close != -1:
                  text = (
                      text[:first_close + 1]
                      + '\n    <uses-permission android:name="android.permission.INTERNET" />\n'
                      + text[first_close + 1:]
                  )

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              meta = f'''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="{app_id}" />
              '''

              text = text.replace(
                  "</application>",
                  meta + "\n        </application>"
              )

          manifest.write_text(text)
          PY

      - name: Get packages
        run: |
          flutter pub get

      - name: Check Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          BANNER_ID="${ADMOB_BANNER_ID:-ca-app-pub-3940256099942544/6300978111}"

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --dart-define=ADMOB_BANNER_ID="$BANNER_ID"

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeRush-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
